name: Validate methodology fixtures
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate example and calculation
        run: python -m src.pes21_method validate
      - name: Run tests
        run: python -m unittest discover -s tests -v
